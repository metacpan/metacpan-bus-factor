name: Publish Bus Factor Data

on:
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel, so a dispatch never aborts a publish mid-deploy
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    container:
      image: perldocker/perl-tester:5.44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: cpm install -g --with-test --cpanfile cpanfile

      - name: Run tests
        run: prove -lr t

      - name: Generate bus factor data
        run: perl bin/bus-factor.pl > bus_factor.json

      - name: Prepare Pages directory
        run: |
          mkdir -p .pages
          gzip -k bus_factor.json
          cp bus_factor.json .pages/
          cp bus_factor.json.gz .pages/

      - name: Convert README to index.html
        uses: davorg/readme-to-index@680157ab6fd127edf618650fcd4a870f3a8dd31f # v1
        with:
          output: .pages/index.html

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .pages/

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
